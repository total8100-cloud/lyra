meta:
  domain: cyber-access-control
  version: "2"
  standard: "IEC 62443-3-3 SR 2.1 Rev.2, NEI 08-09 Rev.7 Update"
  description: "Tightened access control: session expiry 0.85→0.70, new privilege-re-auth rule"
  changelog:
    - rule: session_expiry
      change: "threshold tightened from 0.85 to 0.70 (regulatory revision)"
    - rule: privilege_reauth
      change: "new rule: privilege escalation requires session_age < 0.50"

state_variables:
  - {name: role_level,           index: 0}
  - {name: resource_sensitivity, index: 1}
  - {name: auth_state,           index: 2}
  - {name: zone_distance,        index: 3}
  - {name: session_age,          index: 4}

actions:
  - {name: scan,               index: 0}
  - {name: access_low,         index: 1}
  - {name: access_high,        index: 2}
  - {name: lateral_move,       index: 3}
  - {name: privilege_escalate, index: 4}

constraints:
  - name: least_privilege
    trigger: {action: access_high}
    violation:
      type: threshold_above
      expr: "resource_sensitivity - role_level"
      threshold: 0.0
    weight: 2.0

  - name: authentication_gate
    trigger: {action: privilege_escalate}
    violation:
      type: threshold_below
      expr: "auth_state"
      threshold: 1.0
    weight: 2.0

  - name: zone_isolation
    trigger: {action: lateral_move}
    violation:
      type: threshold_above
      expr: "zone_distance * (1 - auth_state)"
      threshold: 0.30
    weight: 1.5

  - name: session_expiry              # REVISED: threshold 0.85 → 0.70
    trigger: always
    violation:
      type: threshold_above
      expr: "session_age"
      threshold: 0.70
    weight: 1.0

  - name: privilege_reauth            # NEW RULE: privilege escalation only on fresh sessions
    trigger: {action: privilege_escalate}
    violation:
      type: threshold_above
      expr: "session_age"
      threshold: 0.50
    weight: 1.5
